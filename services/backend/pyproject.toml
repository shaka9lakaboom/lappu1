[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmirror-backend"
version = "0.1.0"
description = "SkillMirror FastAPI backend (single deployable service; engine boundaries are modules)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.15,<3",
    "psycopg[binary]>=3.3,<3.4",
    "psycopg-pool>=3.3,<3.4",
    "google-genai>=2.25,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "jsonschema>=4.26,<5",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a PostgreSQL database with the Supabase schema (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Integration tests carry literal SQL.
"tests/**" = ["S101", "S105", "S106", "E501"]
# Model prompts are natural-language text blocks.
"app/intelligence/**" = ["E501"]
