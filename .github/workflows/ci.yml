name: CI

on:
  push:
    branches: [main, "skillmirror-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  SUPABASE_CLI_VERSION: "2.117.0"

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No environment files or build output tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)(node_modules|dist|\.next|\.venv|__pycache__)/|\.tsbuildinfo$' | grep -vE '\.env(\.e2e)?\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must not be committed:"; echo "$bad"; exit 1; fi
      - name: No secret-looking values tracked
        run: |
          # Supabase secret keys, service-role JWTs, private keys, Google AI API keys.
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}' -- . ':!*.test.ts'; then
            echo "Possible secret committed"; exit 1
          fi

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check . ../../benchmark/runners
          ruff format --check . ../../benchmark/runners
      # Intelligence tests use a scripted fake model provider: CI never needs GEMINI_API_KEY.
      - name: Test (unit incl. model gateway, engines, contracts, benchmark schema; DB tests skip)
        run: python -m pytest

  backend-integration:
    name: Backend ingestion + intelligence + database (integration)
    runs-on: ubuntu-latest
    # Real PostgreSQL (pgvector) with this repository's migrations: ingestion
    # idempotency and golden envelopes, courses API, skill-graph bootstrap,
    # lexical + vector retrieval, the P3A pipeline and the durable worker.
    # Model calls go to a scripted fake provider; no GEMINI_API_KEY is used.
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Start Postgres and apply migrations
        run: supabase db start
        working-directory: .
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integration tests
        run: python -m pytest -m db -ra
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          REQUIRE_DB_TESTS: "1"

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (web + shared packages)
        run: |
          npm run typecheck --workspace @skillmirror/web
          npm run typecheck --workspace @skillmirror/contracts --workspace @skillmirror/config --workspace @skillmirror/ui
      - name: Unit tests
        run: npm run test:web
      - name: Demo launcher tests (preflight / verify; no env files, no network)
        run: npm run test:demo
      # Deliberately built without Supabase variables: the build must not
      # need secrets, and no page may silently fall back to placeholders.
      - name: Production build
        run: npm run build:web

  extension:
    name: Extension (Chrome MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @skillmirror/extension
      - name: Unit tests (adapter, capture, queue, sync, auth, contracts)
        run: npm run test:extension:unit
      - name: Production build + manifest validation
        run: npm run build:extension
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/extension
      - name: Chromium tests (load unpacked, capture -> queue -> sync E2E)
        run: npm run test:extension
      - uses: actions/upload-artifact@v7
        with:
          name: skillmirror-extension-dist
          path: apps/extension/dist
          if-no-files-found: error

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: pgTAP tests (RLS, signup trigger, pgvector, raw capture, courses, skill registry, P3A provenance)
        run: supabase test db

  auth-e2e-local:
    name: Auth round trip (local Supabase stack)
    runs-on: ubuntu-latest
    # Proves the auth code paths against a real Supabase Auth + Postgres stack
    # started from this repository's migrations. It does NOT replace the gate
    # against the hosted project (see docs/project-state.md).
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Supabase (auth, rest, db)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase connection values
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' > "$RUNNER_TEMP/supabase.env"
          cut -d= -f1 "$RUNNER_TEMP/supabase.env"
          test "$(wc -l < "$RUNNER_TEMP/supabase.env")" -eq 3
          cat "$RUNNER_TEMP/supabase.env" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build web against the local stack
        run: npm run build:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Auth round trip
        run: npm run e2e:auth
        env:
          E2E_WEB_COMMAND: npm run start
          E2E_REQUIRE: "1"

  e2e-replay:
    name: E2E replay (API + worker + database + browser, replayed model)
    runs-on: ubuntu-latest
    # H13 (P9): sign in -> course -> three captured ChatGPT turns -> the real worker -> Activity ->
    # Skill Detail -> VERIFY -> Verification Center -> answer -> deterministic grade ->
    # VERIFICATION evidence -> ledger. Real FastAPI routes, the real durable worker and a real local
    # Supabase stack (Auth + Postgres). Model output is REPLAYED from the committed Flash-Lite
    # recording; verification generation (its prompt names the new session) gets a deterministic
    # challenge. No job has a Gemini key: a request missing from the recording fails.
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Supabase (auth, rest, db)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase connection values
        run: |
          supabase status -o env > "$RUNNER_TEMP/status.env"
          get() { grep "^$1=" "$RUNNER_TEMP/status.env" | head -1 | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/'; }
          {
            echo "E2E_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "E2E_DATABASE_URL=$(get DB_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "E2E_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "E2E_JWT_SECRET=$(get JWT_SECRET)"
            echo "NEXT_PUBLIC_API_URL=http://localhost:8000"
          } > "$RUNNER_TEMP/e2e.env"
          cut -d= -f1 "$RUNNER_TEMP/e2e.env"
          if grep -qE '=$' "$RUNNER_TEMP/e2e.env"; then echo "a local Supabase value is missing"; exit 1; fi
          cat "$RUNNER_TEMP/e2e.env" >> "$GITHUB_ENV"
      - name: Install backend
        run: python -m pip install -e ".[dev]"
        working-directory: services/backend
      - run: npm ci
      - name: Build web against the local stack
        run: npm run build:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Prepare (fixture graphs with replayed embeddings, learner, membership)
        run: python scripts/e2e_replay.py prepare
        working-directory: services/backend
      - name: Start the API + worker on the replay provider
        working-directory: services/backend
        run: |
          nohup python scripts/e2e_replay.py serve > "$RUNNER_TEMP/e2e-serve.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/e2e-serve.log"
          exit 1
      - name: Browser flow (Playwright, production web build)
        run: npx playwright test e2e/p9-replay-e2e.spec.ts
        working-directory: apps/web
        env:
          E2E_WEB_COMMAND: npm run start
          E2E_REPLAY_STATE: ${{ github.workspace }}/test-results/e2e-replay/state.json
      - name: Verify (0 real requests, 0 stale-recording misses, evidence, verification, ledger)
        run: python scripts/e2e_replay.py verify
        working-directory: services/backend
      - name: API + worker log
        if: always()
        run: cat "$RUNNER_TEMP/e2e-serve.log" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-replay-results
          path: |
            apps/web/test-results
            test-results/e2e-replay/verify.json
          if-no-files-found: ignore
